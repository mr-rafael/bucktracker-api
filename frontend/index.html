<!DOCTYPE html>
<html lang="en" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Bucktracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/api-errors.js"></script>
  </head>
  <body class="min-h-screen bg-base-200 flex items-center justify-center p-6">
    <main class="card w-full max-w-md bg-base-100 shadow-xl">
      <div class="card-body items-center text-center gap-4">
        <h1 class="card-title text-3xl">Welcome to Bucktracker</h1>
        <p class="text-base-content/70">
          BuckTracker is ready. Click below to check the API health endpoint.
        </p>
        <div class="card-actions">
          <button id="check-backend" class="btn btn-outline">Check backend</button>
          <a href="/login.html" class="btn btn-primary">Log in</a>
        </div>
        <div class="card-actions">
          <a href="/loan-calculator.html?from=welcome" class="btn btn-primary">
            Loan Calculator
          </a>
          <a href="/savings-calculator.html?from=welcome" class="btn btn-primary">
            Savings Calculator
          </a>
        </div>
        <p id="backend-result" class="text-sm text-base-content/80 min-h-6"></p>
      </div>
    </main>

    <script>
      const resultEl = document.getElementById("backend-result");
      const buttonEl = document.getElementById("check-backend");

      async function checkBackend() {
        resultEl.textContent = "Calling backend...";
        try {
          const response = await fetch("http://localhost:8080/api/healthz");
          if (!response.ok) {
            resultEl.textContent = `Backend error: ${await apiErrors.formatResponse(response)}`;
            return;
          }

          resultEl.textContent = `Backend responded: ${await response.text()}`;
        } catch (error) {
          resultEl.textContent = apiErrors.formatNetworkError(error);
        }
      }

      buttonEl.addEventListener("click", checkBackend);
      checkBackend();
    </script>
  </body>
</html>
