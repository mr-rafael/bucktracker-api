<!DOCTYPE html>
<html lang="en" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuckTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-base-200 flex items-center justify-center p-6">
    <main class="card w-full max-w-md bg-base-100 shadow-xl">
      <div class="card-body items-center text-center gap-4">
        <h1 class="card-title text-3xl">Hello World</h1>
        <p class="text-base-content/70">
          BuckTracker is ready. Click below to check the API health endpoint.
        </p>
        <div class="card-actions">
          <button id="check-backend" class="btn btn-primary">Check backend</button>
          <a href="/login.html" class="btn btn-outline">Log in</a>
        </div>
        <p id="backend-result" class="text-sm text-base-content/80 min-h-6"></p>
      </div>
    </main>

    <script>
      const resultEl = document.getElementById("backend-result");
      const buttonEl = document.getElementById("check-backend");

      async function checkBackend() {
        resultEl.textContent = "Calling backend...";
        try {
          const response = await fetch("http://localhost:8080/api/healthz");
          const body = await response.text();
          resultEl.textContent = response.ok
            ? `Backend responded: ${body}`
            : `Backend error (${response.status}): ${body}`;
        } catch (error) {
          resultEl.textContent = `Could not reach backend: ${error.message}`;
        }
      }

      buttonEl.addEventListener("click", checkBackend);
      checkBackend();
    </script>
  </body>
</html>
