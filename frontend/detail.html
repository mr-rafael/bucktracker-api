<!DOCTYPE html>
<html lang="en" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan details | BuckTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/api-errors.js"></script>
    <script src="/formatters.js"></script>
    <script src="/authenticated-api.js"></script>
    <script src="/delete-modal.js"></script>
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto max-w-4xl p-6 sm:p-10">
      <a id="back-link" href="/dashboard.html" class="btn btn-ghost btn-sm mb-6">
        ← Back to dashboard
      </a>

      <header class="mb-8">
        <p id="detail-type" class="mb-1 text-sm font-semibold uppercase tracking-wider text-primary">
          Plan details
        </p>
        <div id="detail-title-row" class="flex items-start gap-3">
          <h1 id="detail-title" class="break-words text-3xl font-bold sm:text-4xl">Loading...</h1>
          <button
            id="edit-name-button"
            type="button"
            class="btn btn-ghost btn-square btn-sm mt-1 hidden shrink-0 text-base-content/40 hover:text-base-content"
            aria-label="Edit name"
            title="Edit name"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="size-5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897z"
              />
            </svg>
          </button>
        </div>
      </header>

      <div id="detail-status" class="alert" role="status" aria-live="polite">
        <span>Loading details...</span>
      </div>

      <div id="detail-sections" class="hidden space-y-8"></div>
    </main>

    <script>
      const API_BASE_URL = "http://localhost:8080";
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type");
      const id = params.get("id");
      const loanId = params.get("loanId");
      const typeConfig = {
        loans: {
          label: "Loan",
          endpoint: "/app/loans",
        },
        savings: {
          label: "Savings",
          endpoint: "/app/savings",
        },
        "payment-plans": {
          label: "Payment Plan",
        },
      };

      const config = typeConfig[type];
      const backLink = document.getElementById("back-link");
      const detailType = document.getElementById("detail-type");
      const detailTitle = document.getElementById("detail-title");
      const detailStatus = document.getElementById("detail-status");
      const detailSections = document.getElementById("detail-sections");
      const monetaryFields = new Set([
        "startingCapital",
        "monthlyContribution",
        "totalInterestEarnings",
        "totalDeposited",
        "interest",
        "tax",
        "contribution",
        "increase",
        "capital",
        "startingPrincipal",
        "monthlyPayment",
        "escrowPayment",
        "totalExpenditure",
        "totalPaid",
        "amount",
        "payment",
        "otherPayments",
        "paydown",
        "principal",
      ]);
      const dateFields = new Set(["date", "startDate"]);
      const rateFields = new Set([
        "yearlyInterestRate",
        "taxRate",
        "yearlyInflationRate",
        "rateOfReturn",
        "inflationAdjustedROR",
        "costOfCredit",
      ]);
      const fieldLabels = {
        inflationAdjustedROR: "Inflation Adjusted Rate of Return",
        escrowPayment: "Other Payments",
      };

      function setError(message) {
        detailStatus.className = "alert alert-error";
        detailStatus.querySelector("span").textContent = message;
      }

      function humanize(value) {
        if (fieldLabels[value]) {
          return fieldLabels[value];
        }

        if (/^\d+$/.test(value)) {
          return `Item ${Number(value) + 1}`;
        }

        return value
          .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
          .replace(/[_-]/g, " ")
          .replace(/^./, (letter) => letter.toUpperCase());
      }

      function formatFieldValue(field, value) {
        if (value === null || value === undefined) {
          return "Not provided";
        }

        if (monetaryFields.has(field)) {
          return formatters.dollars(value);
        }

        if (dateFields.has(field)) {
          return formatters.date(value);
        }

        if (rateFields.has(field)) {
          return formatters.percentage(value);
        }

        return String(value);
      }

      function createDetailLine(labelText, valueText) {
        const line = document.createElement("div");
        line.className =
          "grid gap-1 border-b border-base-300 px-5 py-4 last:border-b-0 sm:grid-cols-[minmax(12rem,1fr)_2fr] sm:gap-6";

        const label = document.createElement("dt");
        label.className = "font-medium text-base-content/65";
        label.textContent = labelText;

        const value = document.createElement("dd");
        value.className = "break-words";
        value.textContent = valueText === null ? "null" : String(valueText);

        line.append(label, value);
        return line;
      }

      function createDefinitionList(data) {
        const list = document.createElement("dl");
        list.className =
          "overflow-hidden rounded-box border border-base-300 bg-base-100 shadow-sm";

        Object.entries(data).forEach(([key, value]) => {
          list.appendChild(createDetailLine(humanize(key), formatFieldValue(key, value)));
        });

        return list;
      }

      function parseDollars(value) {
        const normalizedValue = String(value).replace(/[$,\s]/g, "");
        if (!/^\d+(?:\.\d{0,2})?$/.test(normalizedValue)) {
          return null;
        }

        const amount = Number(normalizedValue);
        return Number.isFinite(amount) ? Math.round(amount * 100) : null;
      }

      function createPencilButton(label, onClick) {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          "btn btn-ghost btn-square btn-xs shrink-0 text-base-content/40 hover:bg-transparent hover:text-base-content";
        button.setAttribute("aria-label", `Edit ${label}`);
        button.title = `Edit ${label}`;
        button.innerHTML = `
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="size-4"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897z"
            />
          </svg>
        `;
        button.addEventListener("click", onClick);
        return button;
      }

      function attachCurrencyInput(input, cents) {
        input.dataset.cents = String(cents);
        input.addEventListener("focus", () => {
          if (input.dataset.cents !== undefined) {
            input.value = (Number(input.dataset.cents) / 100).toFixed(2);
          }
        });
        input.addEventListener("input", () => {
          const sanitizedValue = input.value
            .replace(/[^\d.]/g, "")
            .replace(/^(\d*\.?\d{0,2}).*$/, "$1");
          input.value = sanitizedValue;
          const parsedCents = parseDollars(sanitizedValue);
          if (parsedCents === null) {
            delete input.dataset.cents;
          } else {
            input.dataset.cents = String(parsedCents);
          }
          syncPlanUpdateButton();
        });
        input.addEventListener("blur", () => {
          if (input.dataset.cents !== undefined) {
            input.value = formatters.dollars(input.dataset.cents);
          }
          syncPlanUpdateButton();
        });
      }

      function createPlanFieldInput(field, rawValue) {
        if (field === "interestRateType") {
          const select = document.createElement("select");
          select.className = "select select-bordered w-full max-w-xs";
          ["APY", "APR"].forEach((optionValue) => {
            const option = document.createElement("option");
            option.value = optionValue;
            option.textContent = optionValue;
            if (optionValue === rawValue) {
              option.selected = true;
            }
            select.appendChild(option);
          });
          return select;
        }

        const input = document.createElement("input");
        input.className = "input input-bordered w-full max-w-xs";
        input.autocomplete = "off";

        if (monetaryFields.has(field)) {
          input.type = "text";
          input.inputMode = "decimal";
          input.value = formatters.dollars(rawValue);
          attachCurrencyInput(input, rawValue);
          return input;
        }

        if (field === "durationYears") {
          input.type = "number";
          input.min = "1";
          input.step = "1";
          input.value = String(rawValue ?? "");
          return input;
        }

        if (dateFields.has(field)) {
          input.type = "date";
          input.value = formatters.date(rawValue);
          return input;
        }

        if (rateFields.has(field)) {
          input.type = "text";
          input.inputMode = "decimal";
          input.value = String(rawValue ?? "");
          return input;
        }

        input.type = "text";
        input.value = rawValue == null ? "" : String(rawValue);
        return input;
      }

      function readPlanInputValue(field, input) {
        if (monetaryFields.has(field)) {
          return input.dataset.cents === undefined ? null : Number(input.dataset.cents);
        }

        if (field === "durationYears") {
          const value = Number(input.value);
          return Number.isInteger(value) ? value : null;
        }

        if (dateFields.has(field)) {
          return input.value ? formatters.date(input.value) : null;
        }

        if (rateFields.has(field)) {
          return input.value.trim().replace(/%$/, "");
        }

        return input.value.trim();
      }

      function planValuesEqual(field, current, original) {
        if (current === null || current === undefined || current === "") {
          return false;
        }

        if (monetaryFields.has(field) || field === "durationYears") {
          return Number(current) === Number(original);
        }

        if (dateFields.has(field)) {
          return String(current) === formatters.date(original);
        }

        return String(current) === String(original);
      }

      function getChangedPlanPayload() {
        const payload = {};
        Object.entries(planEditor.inputs).forEach(([field, input]) => {
          const current = readPlanInputValue(field, input);
          if (!planValuesEqual(field, current, planEditor.original[field])) {
            if (current !== null && current !== "") {
              payload[field] = current;
            }
          }
        });
        return payload;
      }

      function hasInvalidPlanEdits() {
        return Object.entries(planEditor.inputs).some(([field, input]) => {
          const current = readPlanInputValue(field, input);
          return current === null || current === "";
        });
      }

      function syncPlanUpdateButton() {
        if (!planEditor.updateButton) {
          return;
        }

        const payload = getChangedPlanPayload();
        const invalid = hasInvalidPlanEdits();
        planEditor.updateButton.classList.toggle(
          "hidden",
          invalid || Object.keys(payload).length === 0,
        );
      }

      function beginPlanFieldEdit(field, rawValue, valueElement, pencil) {
        if (planEditor.inputs[field]) {
          return;
        }

        const input = createPlanFieldInput(field, rawValue);
        input.addEventListener("input", syncPlanUpdateButton);
        input.addEventListener("change", syncPlanUpdateButton);
        planEditor.inputs[field] = input;
        valueElement.replaceChildren(input);
        pencil.classList.add("hidden");
        input.focus();
        if (typeof input.select === "function" && input.tagName === "INPUT") {
          input.select();
        }
        syncPlanUpdateButton();
      }

      function beginPlanNameEdit(rawValue) {
        if (planEditor.inputs.name) {
          return;
        }

        const input = createPlanFieldInput("name", rawValue);
        input.className =
          "input input-bordered min-w-0 flex-1 text-3xl font-bold sm:text-4xl";
        input.addEventListener("input", syncPlanUpdateButton);
        input.addEventListener("change", syncPlanUpdateButton);
        planEditor.inputs.name = input;
        detailTitle.replaceWith(input);
        document.getElementById("edit-name-button").classList.add("hidden");
        input.focus();
        input.select();
        syncPlanUpdateButton();
      }

      function createEditablePlanLine(field, rawValue, editable) {
        const line = document.createElement("div");
        line.className =
          "grid gap-1 border-b border-base-300 px-5 py-4 last:border-b-0 sm:grid-cols-[minmax(12rem,1fr)_2fr] sm:gap-6";

        const label = document.createElement("dt");
        label.className = "font-medium text-base-content/65";
        label.textContent = humanize(field);

        const value = document.createElement("dd");
        value.className = "flex items-center gap-2 break-words";

        const valueText = document.createElement("span");
        valueText.textContent = formatFieldValue(field, rawValue);
        value.appendChild(valueText);

        if (editable) {
          const pencil = createPencilButton(humanize(field), () => {
            beginPlanFieldEdit(field, rawValue, value, pencil);
          });
          value.appendChild(pencil);
        }

        line.append(label, value);
        return line;
      }

      function showPlanUpdateModal() {
        const payload = getChangedPlanPayload();
        if (Object.keys(payload).length === 0) {
          return;
        }

        const currentName =
          planEditor.inputs.name
            ? readPlanInputValue("name", planEditor.inputs.name)
            : planEditor.original.name;
        const displayName =
          currentName || planEditor.original.name || `unnamed ${planEditor.kind}`;

        const dialog = document.createElement("dialog");
        dialog.className = "modal";
        dialog.innerHTML = `
          <div class="modal-box">
            <div data-confirm-content>
              <h3 class="text-lg font-bold" data-confirm-message></h3>
              <div data-error class="alert alert-error mt-4 hidden" role="alert">
                <span></span>
              </div>
              <div class="modal-action" data-confirm-actions></div>
            </div>
            <div data-success-content class="hidden flex-col items-center gap-4 text-center">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                class="size-20 text-success"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9"></circle>
                <path stroke-linecap="round" stroke-linejoin="round" d="m8 12 2.5 2.5L16.5 9"></path>
              </svg>
              <p class="text-lg font-bold">Update successful!</p>
              <div class="modal-action justify-center">
                <button type="button" class="btn btn-primary" data-ok>OK</button>
              </div>
            </div>
          </div>
          <form method="dialog" class="modal-backdrop">
            <button>close</button>
          </form>
        `;
        document.body.appendChild(dialog);
        dialog.querySelector("[data-confirm-message]").textContent =
          `Update ${planEditor.kind} data for ${displayName}?`;

        let reloadOnClose = false;
        const errorAlert = dialog.querySelector("[data-error]");
        const updateButton = document.createElement("button");
        updateButton.type = "button";
        updateButton.className = "btn btn-primary";
        updateButton.textContent = "Update";
        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "btn btn-ghost";
        cancelButton.textContent = "Cancel";

        cancelButton.addEventListener("click", () => dialog.close());
        dialog.querySelector("[data-ok]").addEventListener("click", () => dialog.close());
        dialog.addEventListener("close", () => {
          dialog.remove();
          if (reloadOnClose) {
            window.location.reload();
          }
        });

        updateButton.addEventListener("click", async () => {
          errorAlert.classList.add("hidden");
          updateButton.disabled = true;
          updateButton.textContent = "Updating...";

          try {
            const response = await authenticatedApi.fetch(planEditor.endpoint, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              errorAlert.querySelector("span").textContent =
                await apiErrors.formatResponse(response);
              errorAlert.classList.remove("hidden");
              return;
            }

            reloadOnClose = true;
            dialog.querySelector("[data-confirm-content]").classList.add("hidden");
            dialog.querySelector("[data-success-content]").classList.remove("hidden");
            dialog.querySelector("[data-success-content]").classList.add("flex");
          } catch (error) {
            if (authenticatedApi.isRedirectError(error)) {
              return;
            }

            errorAlert.querySelector("span").textContent =
              error.isBackendResponse || error.isInvalidResponse
                ? error.message
                : apiErrors.formatNetworkError(error);
            errorAlert.classList.remove("hidden");
          } finally {
            updateButton.disabled = false;
            updateButton.textContent = "Update";
          }
        });

        dialog.querySelector("[data-confirm-actions]").append(cancelButton, updateButton);
        dialog.showModal();
      }

      function createEditableInformation(details, { kind, endpoint, editableFields }) {
        planEditor.original = {
          name: details.name || "",
          ...(details.originalData || {}),
        };
        planEditor.inputs = {};
        planEditor.kind = kind;
        planEditor.endpoint = endpoint;

        const information = {
          id: details.id,
          ...(details.originalData || {}),
        };
        const informationList = document.createElement("dl");
        informationList.className =
          "overflow-hidden rounded-box border border-base-300 bg-base-100 shadow-sm";
        Object.entries(information).forEach(([field, rawValue]) => {
          informationList.appendChild(
            createEditablePlanLine(field, rawValue, editableFields.has(field)),
          );
        });

        const updateButton = document.createElement("button");
        updateButton.type = "button";
        updateButton.className = "btn btn-primary hidden";
        updateButton.textContent = "Update";
        updateButton.addEventListener("click", showPlanUpdateModal);
        planEditor.updateButton = updateButton;

        const informationContent = document.createElement("div");
        informationContent.className = "space-y-4";
        informationContent.append(informationList, updateButton);

        const editNameButton = document.getElementById("edit-name-button");
        editNameButton.classList.remove("hidden");
        editNameButton.onclick = () => beginPlanNameEdit(details.name);

        return informationContent;
      }

      const planEditor = {
        original: {},
        inputs: {},
        updateButton: null,
        kind: "",
        endpoint: "",
      };

      const savingsEditableFields = new Set([
        "startingCapital",
        "yearlyInterestRate",
        "interestRateType",
        "monthlyContribution",
        "durationYears",
        "taxRate",
        "yearlyInflationRate",
        "startDate",
      ]);

      const loanEditableFields = new Set([
        "startingPrincipal",
        "yearlyInterestRate",
        "monthlyPayment",
        "escrowPayment",
        "startDate",
      ]);

      function createSection(titleText, content, action = null) {
        const section = document.createElement("section");
        const title = document.createElement("h2");
        title.className = "text-2xl font-bold";
        title.textContent = titleText;

        const header = document.createElement("div");
        header.className = "mb-4 flex flex-wrap items-center justify-between gap-3";
        header.appendChild(title);
        if (action) {
          header.appendChild(action);
        }

        section.append(header, content);
        return section;
      }

      function createDataTable(rows, emptyMessage) {
        if (!Array.isArray(rows) || rows.length === 0) {
          const emptyState = document.createElement("div");
          emptyState.className = "alert";
          emptyState.textContent = emptyMessage;
          return emptyState;
        }

        const columns = [...new Set(rows.flatMap((row) => Object.keys(row)))];
        const wrapper = document.createElement("div");
        wrapper.className =
          "overflow-x-auto rounded-box border border-base-300 bg-base-100 shadow-sm";
        const table = document.createElement("table");
        table.className = "table table-zebra";

        const head = document.createElement("thead");
        const headerRow = document.createElement("tr");
        columns.forEach((column) => {
          const header = document.createElement("th");
          header.textContent = humanize(column);
          headerRow.appendChild(header);
        });
        head.appendChild(headerRow);

        const body = document.createElement("tbody");
        rows.forEach((row) => {
          const tableRow = document.createElement("tr");
          columns.forEach((column) => {
            const cell = document.createElement("td");
            const value = row[column];
            cell.textContent = formatFieldValue(column, value);
            tableRow.appendChild(cell);
          });
          body.appendChild(tableRow);
        });

        table.append(head, body);
        wrapper.appendChild(table);
        return wrapper;
      }

      function createPaymentPlanCard(plan, loanId) {
        const card = document.createElement("article");
        card.className = "card h-full border border-base-300 bg-base-100 shadow-sm";

        const body = document.createElement("div");
        body.className = "card-body gap-3";

        const name = document.createElement("h3");
        name.className = "card-title text-xl";
        name.textContent = plan.name || "Unnamed payment plan";

        const duration = document.createElement("div");
        const durationLabel = document.createElement("p");
        durationLabel.className = "text-sm text-base-content/60";
        durationLabel.textContent = "Duration";
        const durationValue = document.createElement("p");
        durationValue.className = "text-2xl font-semibold text-primary";
        durationValue.textContent = `${plan.durationMonths} months`;
        duration.append(durationLabel, durationValue);

        const id = document.createElement("p");
        id.className = "break-all text-xs text-base-content/60";
        id.textContent = `ID: ${plan.id}`;

        const detailsLink = document.createElement("a");
        detailsLink.className =
          "mt-auto w-fit text-base-content/50 transition-colors hover:text-primary";
        detailsLink.href =
          `/detail.html?type=payment-plans&loanId=${encodeURIComponent(loanId)}` +
          `&id=${encodeURIComponent(plan.id)}`;
        detailsLink.setAttribute(
          "aria-label",
          `View details for ${plan.name || "unnamed payment plan"}`,
        );
        detailsLink.title = "View payment plan details";
        detailsLink.innerHTML = `
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="size-6"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
        `;

        const deleteButton = deleteModal.createTrashButton({
          name: plan.name,
          kind: "Plan",
          endpoint:
            `${API_BASE_URL}/app/loans/${encodeURIComponent(loanId)}` +
            `/payment-plans/${encodeURIComponent(plan.id)}`,
          onSuccess: () => loadDetails(),
        });

        const actions = document.createElement("div");
        actions.className = "mt-auto flex items-end justify-between gap-3";
        actions.append(detailsLink, deleteButton);

        body.append(name, duration, id, actions);
        card.appendChild(body);
        return card;
      }

      function renderLoanDetails(details) {
        const fragment = document.createDocumentFragment();
        fragment.appendChild(
          createSection(
            "Loan Information",
            createEditableInformation(details, {
              kind: "loan",
              endpoint: `${API_BASE_URL}/app/loans/${encodeURIComponent(id)}`,
              editableFields: loanEditableFields,
            }),
          ),
        );

        const defaultPaymentPlan = details.defaultPaymentPlan || {};
        fragment.appendChild(
          createSection(
            "Default Payment Plan",
            createDefinitionList({
              name: defaultPaymentPlan.name || "Not provided",
              id: defaultPaymentPlan.id || "Not provided",
              duration: Number.isFinite(Number(defaultPaymentPlan.durationMonths))
                ? `${defaultPaymentPlan.durationMonths} months`
                : "Not provided",
            }),
          ),
        );

        const paymentPlanGrid = document.createElement("div");
        paymentPlanGrid.className = "grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3";
        const paymentPlans = Array.isArray(details.paymentPlans) ? details.paymentPlans : [];

        if (paymentPlans.length === 0) {
          const emptyState = document.createElement("div");
          emptyState.className = "alert";
          emptyState.textContent = "No payment plans were returned by the backend.";
          paymentPlanGrid.appendChild(emptyState);
        } else {
          paymentPlans.forEach((plan) => {
            paymentPlanGrid.appendChild(createPaymentPlanCard(plan, details.id));
          });
        }

        const createPaymentPlanLink = document.createElement("a");
        createPaymentPlanLink.className = "btn btn-primary btn-sm";
        createPaymentPlanLink.href =
          `/create-payment-plan.html?loanId=${encodeURIComponent(details.id)}`;
        createPaymentPlanLink.textContent = "Add new payment plan";

        fragment.appendChild(
          createSection(
            "Loan Payment Plans",
            paymentPlanGrid,
            createPaymentPlanLink,
          ),
        );
        detailSections.replaceChildren(fragment);
        detailSections.classList.remove("hidden");
        detailStatus.classList.add("hidden");
      }

      function renderSavingsDetails(details) {
        const fragment = document.createDocumentFragment();
        fragment.appendChild(
          createSection(
            "Information",
            createEditableInformation(details, {
              kind: "savings",
              endpoint: `${API_BASE_URL}/app/savings/${encodeURIComponent(id)}`,
              editableFields: savingsEditableFields,
            }),
          ),
        );
        fragment.appendChild(
          createSection(
            "Calculated Information",
            createDefinitionList(details.calculatedData || {}),
          ),
        );
        fragment.appendChild(
          createSection(
            "Savings Plan",
            createDataTable(
              details.plan,
              "No savings plan data was returned by the backend.",
            ),
          ),
        );

        detailSections.replaceChildren(fragment);
        detailSections.classList.remove("hidden");
        detailStatus.classList.add("hidden");
      }

      function renderPaymentPlanDetails(details) {
        const fragment = document.createDocumentFragment();
        const {
          name,
          principalPayments,
          paymentPlanBreakdown,
          ...paymentPlanInformation
        } = details;

        fragment.appendChild(
          createSection(
            "Payment Plan Information",
            createDefinitionList(paymentPlanInformation),
          ),
        );
        fragment.appendChild(
          createSection(
            "Principal Payments",
            createDataTable(
              principalPayments,
              "No principal payments were returned by the backend.",
            ),
          ),
        );
        fragment.appendChild(
          createSection(
            "Payment Plan Breakdown",
            createDataTable(
              paymentPlanBreakdown,
              "No payment plan breakdown was returned by the backend.",
            ),
          ),
        );

        detailSections.replaceChildren(fragment);
        detailSections.classList.remove("hidden");
        detailStatus.classList.add("hidden");
      }

      function renderDetails(details) {
        if (type === "loans") {
          renderLoanDetails(details);
          return;
        }

        if (type === "payment-plans") {
          renderPaymentPlanDetails(details);
          return;
        }

        renderSavingsDetails(details);
      }

      async function loadDetails() {
        const isPaymentPlan = type === "payment-plans";
        if (!config || !id || (isPaymentPlan && !loanId)) {
          detailTitle.textContent = "Invalid detail link";
          setError(
            "INVALID_REQUEST: A valid plan type, plan ID, and parent loan ID are required.",
          );
          return;
        }

        backLink.href = isPaymentPlan
          ? `/detail.html?type=loans&id=${encodeURIComponent(loanId)}`
          : `/dashboard.html#${type}`;
        if (isPaymentPlan) {
          backLink.textContent = "← Back to loan";
        }
        detailType.textContent = config.label;
        const endpoint = isPaymentPlan
          ? `/app/loans/${encodeURIComponent(loanId)}/payment-plans/${encodeURIComponent(id)}`
          : `${config.endpoint}/${encodeURIComponent(id)}`;

        try {
          const response = await authenticatedApi.fetch(`${API_BASE_URL}${endpoint}`);

          if (!response.ok) {
            setError(`Could not load details: ${await apiErrors.formatResponse(response)}`);
            return;
          }

          const details = await response.json();
          const name = details.name || `Unnamed ${config.label.toLowerCase()}`;
          detailTitle.textContent = name;
          document.title = `${name} | BuckTracker`;
          renderDetails(details);
        } catch (error) {
          if (authenticatedApi.isRedirectError(error)) {
            return;
          }

          const message = error.isBackendResponse || error.isInvalidResponse
            ? error.message
            : apiErrors.formatNetworkError(error);
          setError(message);
        }
      }

      loadDetails();
    </script>
  </body>
</html>
