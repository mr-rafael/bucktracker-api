<!DOCTYPE html>
<html lang="en" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Created | BuckTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link
      href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/styles/github-dark.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto max-w-4xl p-6 sm:p-10">
      <div class="card bg-base-100 shadow-xl">
        <div class="card-body items-center gap-6 text-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            class="size-28 text-success"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" d="m8 12 2.5 2.5L16.5 9"></path>
          </svg>

          <h1 id="success-title" class="text-3xl font-bold sm:text-4xl">User Created</h1>

          <a href="/login.html" class="btn btn-primary">Go to Login</a>

          <pre
            class="mt-2 w-full overflow-x-auto rounded-box bg-neutral p-5 text-left text-neutral-content"
          ><code id="response-json" class="language-json"></code></pre>
        </div>
      </div>
    </main>

    <script>
      const title = document.getElementById("success-title");
      const responseCode = document.getElementById("response-json");
      const storedName = sessionStorage.getItem("created_user_name");
      const storedResponse = sessionStorage.getItem("created_user_response");

      function displayName(response) {
        return (
          storedName ||
          response?.username ||
          response?.Username ||
          "unnamed"
        );
      }

      if (!storedResponse) {
        title.textContent = `User ${displayName({})} Created`;
        responseCode.textContent = "{}";
      } else {
        try {
          const response = JSON.parse(storedResponse);
          title.textContent = `User ${displayName(response)} Created`;
          responseCode.textContent = JSON.stringify(response, null, 2);
        } catch {
          title.textContent = `User ${displayName({})} Created`;
          responseCode.textContent = storedResponse;
        }
      }

      document.title = `${title.textContent} | BuckTracker`;
      hljs.highlightElement(responseCode);
    </script>
  </body>
</html>
