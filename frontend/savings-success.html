<!DOCTYPE html>
<html lang="en" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Savings Plan Created | BuckTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="min-h-screen bg-base-200">
    <main class="mx-auto max-w-4xl p-6 sm:p-10">
      <div class="card bg-base-100 shadow-xl">
        <div class="card-body items-center gap-6 text-center">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            class="size-28 text-success"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path stroke-linecap="round" stroke-linejoin="round" d="m8 12 2.5 2.5L16.5 9"></path>
          </svg>

          <h1 class="text-3xl font-bold sm:text-4xl">
            Savings Plan successfully created.
          </h1>

          <div class="flex flex-wrap justify-center gap-3">
            <a href="/dashboard.html#savings" class="btn btn-outline">
              Back to my savings
            </a>
            <a id="detail-link" class="btn btn-primary">See detail</a>
          </div>

          <div id="success-error" class="alert alert-error hidden w-full text-left" role="alert">
            <span></span>
          </div>

          <pre
            class="mt-2 w-full overflow-x-auto rounded-box bg-neutral p-5 text-left text-neutral-content"
          ><code id="response-json"></code></pre>
        </div>
      </div>
    </main>

    <script>
      const responseCode = document.getElementById("response-json");
      const detailLink = document.getElementById("detail-link");
      const errorAlert = document.getElementById("success-error");
      const storedResponse = sessionStorage.getItem("created_savings_response");

      if (!storedResponse) {
        errorAlert.querySelector("span").textContent =
          "INVALID_STATE: The savings response is not available in this browser tab.";
        errorAlert.classList.remove("hidden");
        detailLink.classList.add("btn-disabled");
        detailLink.removeAttribute("href");
        responseCode.textContent = "{}";
      } else {
        try {
          const response = JSON.parse(storedResponse);
          responseCode.textContent = JSON.stringify(response, null, 2);
          detailLink.href =
            `/detail.html?type=savings&id=${encodeURIComponent(response.id)}`;
        } catch (error) {
          errorAlert.querySelector("span").textContent =
            `INVALID_RESPONSE: ${error.message}`;
          errorAlert.classList.remove("hidden");
          detailLink.classList.add("btn-disabled");
          responseCode.textContent = storedResponse;
        }
      }
    </script>
  </body>
</html>
