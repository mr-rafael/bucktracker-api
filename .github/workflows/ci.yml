name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      POSTGRES_CONNECTION_STRING: "postgres://ci:ci@localhost:5432/bucktracker_test?sslmode=disable"
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bucktracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bucktracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check Go formatting
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          working-directory: backend

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.3

      - name: Apply database migrations
        working-directory: backend
        run: goose -dir internal/db/migrations postgres "$POSTGRES_CONNECTION_STRING" up

      - name: Test
        working-directory: backend
        run: go test ./...
